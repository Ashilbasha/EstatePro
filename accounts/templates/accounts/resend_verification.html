<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resend Verification | EstatePro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .verification-card {
            background: white;
            max-width: 480px;
            width: 90%;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }
    </style>

</head>

<body>

    <div class="verification-card">

        <div class="text-center mb-4">

            <h2 class="fw-bold">EstatePro</h2>

            <h4 class="mt-4">Resend Verification Email</h4>

            <p class="text-muted mt-2">
                Enter your registered email address.
                We will send you a new verification link
                if your account is not yet verified.
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-warning w-100"
            >
                Resend Verification Email
            </button>

        </form>

        <div class="text-center mt-4">

            <a href="{% url 'login' %}">
                Back to Login
            </a>

        </div>

    </div>

</body>
</html>
