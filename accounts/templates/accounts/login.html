<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login | EstatePro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">EstatePro</a>
            <a href="/" class="btn btn-warning">Home</a>
        </div>
    </nav>

    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow p-4">

                    <h2 class="text-center fw-bold mb-3">
                        Welcome Back!
                    </h2>

                    <p class="text-center text-muted">
                        Login to your EstatePro account.
                    </p>
<!-- Messages -->
{% if messages %}

    {% for message in messages %}

        <div class="alert alert-{{ message.tags }} alert-dismissible fade show"
             role="alert">

            {{ message }}

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
            </button>

        </div>

    {% endfor %}

{% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <input type="hidden" name="next" value="{{ request.GET.next }}">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                                required
                            >
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Password</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required
                            >
                        </div>

                        <div class="text-end mb-3">
                            <a href="{% url 'password_reset' %}" class="text-decoration-none">
                                Forgot Password?
                            </a>

                            <br>

                            <a href="{% url 'resend_verification' %}" class="text-decoration-none">
                                Didn't receive verification email?
                            </a>
                        </div>

                        <button type="submit" class="btn btn-warning w-100">
                            Login
                        </button>

                    </form>

                    <p class="text-center mt-4 mb-0">
                        Don't have an account?
                        <a href="{% url 'register' %}">Register Here</a>
                    </p>

                </div>

            </div>
        </div>
    </section>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            © 2026 EstatePro. All rights reserved.
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
